<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOATRACE AI リアルタイム予想・集計</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #38bdf8;
      --honmei: #ef4444;
      --chuan: #3b82f6;
      --oana: #10b981;
      --hit: #eab308;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 12px; }
    header { text-align: center; margin-bottom: 16px; padding: 12px; background: var(--card); border-radius: 8px; border: 1px solid var(--border); }
    h1 { font-size: 1.25rem; color: var(--accent); }
    .status-bar { display: flex; justify-content: space-around; margin-top: 8px; font-size: 0.85rem; color: var(--subtext); }
    .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
    .metric-card { background: var(--card); border: 1px solid var(--border); padding: 10px; border-radius: 8px; text-align: center; }
    .metric-title { font-size: 0.75rem; color: var(--subtext); }
    .metric-val { font-size: 1.1rem; font-weight: bold; margin-top: 4px; color: var(--text); }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; }
    .tab-btn { background: var(--card); border: 1px solid var(--border); color: var(--subtext); padding: 8px 16px; border-radius: 6px; cursor: pointer; white-space: nowrap; font-weight: bold; }
    .tab-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
    .venue-selector { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 4px; }
    .v-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; white-space: nowrap; }
    .v-btn.active { background: #0284c7; border-color: #38bdf8; font-weight: bold; }
    .race-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; padding: 10px; font-size: 0.9rem; }
    .race-head { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 6px; font-weight: bold; }
    .pred-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; margin-bottom: 6px; }
    .pred-item { padding: 4px; border-radius: 4px; font-size: 0.8rem; }
    .pred-honmei { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--honmei); color: #fca5a5; }
    .pred-chuan { background: rgba(59, 130, 246, 0.15); border: 1px solid var(--chuan); color: #93c5fd; }
    .pred-oana { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--oana); color: #6ee7b7; }
    .res-row { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.25); padding: 6px 8px; border-radius: 4px; font-size: 0.85rem; }
    .badge-hit { background: var(--hit); color: #000; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .history-table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 8px; overflow: hidden; font-size: 0.8rem; text-align: center; }
    .history-table th, .history-table td { padding: 8px 4px; border-bottom: 1px solid var(--border); }
    .history-table th { background: rgba(0,0,0,0.3); color: var(--subtext); }
  </style>
</head>
<body>

  <header>
    <h1>BOATRACE AI リアルタイム実測</h1>
    <div class="status-bar">
      <span id="date-label">日付: 取得中...</span>
      <span id="update-label">ステータス: 待機中</span>
    </div>
  </header>

  <div class="summary-grid">
    <div class="metric-card"><div class="metric-title">全レース / 終了</div><div class="metric-val" id="race-progress">-- / --</div></div>
    <div class="metric-card"><div class="metric-title">総的中数 (本/中/穴)</div><div class="metric-val" id="hit-count">-- ( - / - / - )</div></div>
    <div class="metric-card"><div class="metric-title">総的中率</div><div class="metric-val" id="hit-rate">--%</div></div>
    <div class="metric-card"><div class="metric-title">総回収率 / 払戻</div><div class="metric-val" id="recovery-rate">--% (¥0)</div></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-today-btn" onclick="switchView('today')">本日の出走・結果</button>
    <button class="tab-btn" id="tab-hist-btn" onclick="switchView('hist')">過去ログ・成績集計</button>
  </div>

  <main id="today-view">
    <div class="venue-selector" id="venue-list"></div>
    <div id="races-container"></div>
  </main>

  <main id="hist-view" style="display: none;">
    <table class="history-table">
      <thead>
        <tr>
          <th>日付</th><th>R数</th><th>的中</th><th>的中率</th><th>回収率</th><th>払戻金</th>
        </tr>
      </thead>
      <tbody id="history-body"></tbody>
    </table>
  </main>

  <script>
    let rawData = null;
    let rawHistory = null;
    let activeVenue = "";

    async function loadData() {
      try {
        const [dRes, hRes] = await Promise.all([
          fetch('data.json?t=' + Date.now()),
          fetch('history.json?t=' + Date.now())
        ]);
        
        if (dRes.ok) rawData = await dRes.json();
        if (hRes.ok) rawHistory = await hRes.json();
        
        renderToday();
        renderHistory();
      } catch (err) {
        document.getElementById('update-label').innerText = 'データ読み込み待機中（初回生成前）';
      }
    }

    function renderToday() {
      if (!rawData || !rawData.venues) {
        document.getElementById('update-label').innerText = '本日データ未生成 (Actions実行待ち)';
        return;
      }

      document.getElementById('date-label').innerText = `日付: ${rawData.date}`;
      document.getElementById('update-label').innerText = `公式データ同期済み`;

      const venues = Object.keys(rawData.venues);
      if (venues.length === 0) return;

      if (!activeVenue || !rawData.venues[activeVenue]) {
        activeVenue = venues[0];
      }

      const vList = document.getElementById('venue-list');
      vList.innerHTML = venues.map(v => 
        `<button class="v-btn ${v === activeVenue ? 'active' : ''}" onclick="selectVenue('${v}')">${v}</button>`
      ).join('');

      renderRaces();
      calculateTodayMetrics();
    }

    function selectVenue(v) {
      activeVenue = v;
      renderToday();
    }

    function renderRaces() {
      const container = document.getElementById('races-container');
      const races = rawData.venues[activeVenue];
      if (!races) return;

      let html = "";
      for (let r = 1; r <= 12; r++) {
        const rKey = `${r}R`;
        const rData = races[rKey];
        if (!rData) continue;

        const isHitHonmei = rData.result && rData.result === rData.honmei;
        const isHitChuan = rData.result && rData.result === rData.chuan;
        const isHitOana = rData.result && rData.result === rData.oana;
        const isHit = isHitHonmei || isHitChuan || isHitOana;

        html += `
          <div class="race-card">
            <div class="race-head">
              <span>${activeVenue} ${rKey}</span>
              <span>${rData.result ? '<span style="color:#10b981">確定</span>' : '出走予定'}</span>
            </div>
            <div class="pred-row">
              <div class="pred-item pred-honmei">本命: ${rData.honmei}</div>
              <div class="pred-item pred-chuan">対抗: ${rData.chuan}</div>
              <div class="pred-item pred-oana">大穴: ${rData.oana}</div>
            </div>
            <div class="res-row">
              <span>結果: <strong>${rData.result || '待機中'}</strong></span>
              <span>${rData.payout ? `¥${rData.payout.toLocaleString()}` : ''}</span>
              ${isHit ? '<span class="badge-hit">的中</span>' : ''}
            </div>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    function calculateTodayMetrics() {
      let finished = 0;
      let hCnt = 0, cCnt = 0, oCnt = 0;
      let totalPay = 0;
      const totalRaces = rawData.total_races || 0;

      for (const v of Object.keys(rawData.venues)) {
        for (let r = 1; r <= 12; r++) {
          const item = rawData.venues[v][`${r}R`];
          if (item && item.result) {
            finished++;
            if (item.result === item.honmei) { hCnt++; totalPay += item.payout; }
            else if (item.result === item.chuan) { cCnt++; totalPay += item.payout; }
            else if (item.result === item.oana) { oCnt++; totalPay += item.payout; }
          }
        }
      }

      const hits = hCnt + cCnt + oCnt;
      const invest = finished * 200;
      const hitRate = totalRaces > 0 ? ((hits / totalRaces) * 100).toFixed(1) : "0.0";
      const recovery = invest > 0 ? ((totalPay / invest) * 100).toFixed(1) : "0.0";

      document.getElementById('race-progress').innerText = `${totalRaces} / ${finished}`;
      document.getElementById('hit-count').innerText = `${hits} ( ${hCnt} / ${cCnt} / ${oCnt} )`;
      document.getElementById('hit-rate').innerText = `${hitRate}%`;
      document.getElementById('recovery-rate').innerText = `${recovery}% (¥${totalPay.toLocaleString()})`;
    }

    function renderHistory() {
      if (!rawHistory) return;
      const tbody = document.getElementById('history-body');
      const dates = Object.keys(rawHistory).sort().reverse();
      tbody.innerHTML = dates.map(d => {
        const item = rawHistory[d];
        return `
          <tr>
            <td>${item.date}</td>
            <td>${item.finished}</td>
            <td>${item.hits}</td>
            <td>${item.hitRate}</td>
            <td>${item.recovery}</td>
            <td>¥${item.totalPay.toLocaleString()}</td>
          </tr>
        `;
      }).join('');
    }

    function switchView(view) {
      if (view === 'today') {
        document.getElementById('today-view').style.display = 'block';
        document.getElementById('hist-view').style.display = 'none';
        document.getElementById('tab-today-btn').classList.add('active');
        document.getElementById('tab-hist-btn').classList.remove('active');
      } else {
        document.getElementById('today-view').style.display = 'none';
        document.getElementById('hist-view').style.display = 'block';
        document.getElementById('tab-today-btn').classList.remove('active');
        document.getElementById('tab-hist-btn').classList.add('active');
      }
    }

    loadData();
    setInterval(loadData, 60000);
  </script>
</body>
</html>
